admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - address:
        socket_address:
          address: 0.0.0.0
          port_value: 1062
      per_connection_buffer_limit_bytes: 52428800
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: auto
                access_log:
                  - name: log_used_token
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          used_token: "%DYNAMIC_METADATA(io.envoy.ai_gateway:used_token)%"
                          some_cel: "%DYNAMIC_METADATA(io.envoy.ai_gateway:some_cel)%"
                  - name: default
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StderrAccessLog
                route_config:
                  virtual_hosts:
                    - name: local_route
                      # Keeps x-envoy-attempt-count updated on the request per upstream attempt so the
                      # dynamic-fallback matcher cluster specifier can key on it (see the
                      # dynamic-fallback routes below).
                      include_request_attempt_count: true
                      # TODO: move this at route level to match the behavior of EG.
                      retry_policy:
                        retry_on: "5xx,gateway-error,reset,rest-before-request,connect-failure,envoy-ratelimited,retriable-4xx,refused-stream,retriable-status-codes,retriable-headers"
                        num_retries: 5
                        per_try_timeout: "30s"
                        retry_priority:
                          name: envoy.retry_priorities.previous_priorities
                          typedConfig:
                            "@type": type.googleapis.com/envoy.extensions.retry.priority.previous_priorities.v3.PreviousPrioritiesConfig
                            updateFrequency: 1
                        retry_back_off:
                          base_interval: "0.1s"
                          max_interval: "1s"
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: us.amazon.nova-micro-v1:0
                          route:
                            auto_host_rewrite: true
                            cluster: aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: claude-sonnet-4-5
                          route:
                            auto_host_rewrite: true
                            cluster: anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: global.anthropic.claude-sonnet-4-5-20250929-v1:0
                          route:
                            auto_host_rewrite: true
                            cluster: anthropic_aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: us.anthropic.claude-sonnet-4-5-20250929-v1:0
                          route:
                            auto_host_rewrite: true
                            cluster: aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: gpt-4o-mini
                          route:
                            auto_host_rewrite: true
                            cluster: openai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: text-embedding-3-small
                          route:
                            auto_host_rewrite: true
                            cluster: openai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: amazon.titan-embed-text-v2:0
                          route:
                            auto_host_rewrite: true
                            cluster: aws_bedrock
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: o1
                          route:
                            auto_host_rewrite: true
                            cluster: azure_openai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: gemini-3.1-flash-lite
                          route:
                            auto_host_rewrite: true
                            cluster: gemini
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: gemini-embedding-001
                          route:
                            auto_host_rewrite: true
                            cluster: gemini
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: llama-3.1-8b-instant
                          route:
                            auto_host_rewrite: true
                            cluster: groq
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: grok-3
                          route:
                            auto_host_rewrite: true
                            cluster: grok
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: Meta-Llama-3.1-8B-Instruct
                          route:
                            auto_host_rewrite: true
                            cluster: sambanova
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: E5-Mistral-7B-Instruct
                          route:
                            auto_host_rewrite: true
                            cluster: sambanova
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: meta-llama/Meta-Llama-3-8B-Instruct
                          route:
                            auto_host_rewrite: true
                            cluster: deepinfra
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-ai-eg-model
                                string_match:
                                  exact: BAAI/bge-base-en-v1.5
                          route:
                            auto_host_rewrite: true
                            cluster: deepinfra
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: openai
                          route:
                            cluster: testupstream-openai
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                route_name: "test-ns/openai-route"
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: anthropic
                          route:
                            cluster: testupstream-anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: modelname-override
                          route:
                            cluster: testupstream-modelname-override
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                route_name: "test-ns/modelname-override-route"
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: aws-bedrock
                          route:
                            cluster: testupstream-aws
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: azure-openai
                          route:
                            cluster: testupstream-azure
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: gcp-vertexai
                          route:
                            cluster: testupstream-gcp-vertexai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: gcp-anthropicai
                          route:
                            cluster: testupstream-gcp-anthropicai
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: aws-anthropic
                          route:
                            cluster: testupstream-aws-anthropic
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: modelname-override-and-fallback
                          route:
                            cluster: testupstream-modelname-override-and-fallback
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: body-mutation
                          route:
                            cluster: testupstream-body-mutation
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: body-mutation-anthropic
                          route:
                            cluster: testupstream-body-mutation-anthropic
                        # Dynamic per-request fallback: slot k serves attempt k+1 because the
                        # attempt-count header observed at refresh time is the one stamped during
                        # the previous attempt's upstream send.
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: dynamic-fallback
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                dynfb_rule_key: "default/route/dyn/rule/0"
                          route:
                            retry_policy:
                              retry_on: "5xx"
                              num_retries: 2
                              refresh_cluster_on_retry: true
                              retry_back_off:
                                base_interval: "0.05s"
                                max_interval: "0.2s"
                            inline_cluster_specifier_plugin:
                              extension:
                                name: envoy.router.cluster_specifier_plugin.matcher
                                typed_config:
                                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.MatcherClusterSpecifier
                                  cluster_matcher:
                                    matcher_tree:
                                      input:
                                        name: attempt-count
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                          header_name: x-envoy-attempt-count
                                      exact_match_map:
                                        map:
                                          "0":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try0
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-0
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-a5xx
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-a5xx
                                          "1":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try1
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-1
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-a5xx
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-aws
                                          "2":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try2
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-2
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-a5xx
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-aws
                                    on_no_match:
                                      action:
                                        name: cluster
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                          cluster: testupstream-dynamic-a5xx
                        # Same mechanism, but the primary is a healthy openai-schema backend whose
                        # request will 400 on the testupstream's expectation checks (expectations
                        # target the secondary's AWS translation). retriable-status-codes: 400 makes
                        # that mismatch drive the walk, which lets the test assert the exact
                        # translated path/body that the secondary received.
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: dynamic-fallback-strict
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                dynfb_rule_key: "default/route/dyn/rule/0"
                          route:
                            retry_policy:
                              retry_on: "5xx,retriable-status-codes"
                              retriable_status_codes:
                                - 400
                              num_retries: 2
                              refresh_cluster_on_retry: true
                              retry_back_off:
                                base_interval: "0.05s"
                                max_interval: "0.2s"
                            inline_cluster_specifier_plugin:
                              extension:
                                name: envoy.router.cluster_specifier_plugin.matcher
                                typed_config:
                                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.MatcherClusterSpecifier
                                  cluster_matcher:
                                    matcher_tree:
                                      input:
                                        name: attempt-count
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                          header_name: x-envoy-attempt-count
                                      exact_match_map:
                                        map:
                                          "0":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try0
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-0
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-openai
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-openai
                                          "1":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try1
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-1
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-openai
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-aws
                                    on_no_match:
                                      action:
                                        name: cluster
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                          cluster: testupstream-dynamic-openai
                        # Same shared clusters as -strict, but a different rule key: the extproc must whose
                        # resolve rule-scoped backend config (modelNameOverride) via (rule key, backend
                        # key) composition, proving per-rule config over shared clusters.
                        - match:
                            prefix: "/"
                            headers:
                              - name: x-test-backend
                                string_match:
                                  exact: dynamic-fallback-alt
                          metadata:
                            filter_metadata:
                              aigateway.envoy.io:
                                dynfb_rule_key: "default/route/dyn/rule/1"
                          route:
                            retry_policy:
                              retry_on: "5xx,retriable-status-codes"
                              retriable_status_codes:
                                - 400
                              num_retries: 2
                              refresh_cluster_on_retry: true
                              retry_back_off:
                                base_interval: "0.05s"
                                max_interval: "0.2s"
                            inline_cluster_specifier_plugin:
                              extension:
                                name: envoy.router.cluster_specifier_plugin.matcher
                                typed_config:
                                  "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.MatcherClusterSpecifier
                                  cluster_matcher:
                                    matcher_tree:
                                      input:
                                        name: attempt-count
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                          header_name: x-envoy-attempt-count
                                      exact_match_map:
                                        map:
                                          "0":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try0
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-0
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-openai
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-openai
                                          "1":
                                            matcher:
                                              matcher_tree:
                                                input:
                                                  name: try1
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                                    header_name: x-aigw-try-1
                                                exact_match_map:
                                                  map:
                                                    "primary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-openai
                                                    "secondary":
                                                      action:
                                                        name: cluster
                                                        typed_config:
                                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                          cluster: testupstream-dynamic-aws
                                              on_no_match:
                                                action:
                                                  name: cluster
                                                  typed_config:
                                                    "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                                    cluster: testupstream-dynamic-aws
                                    on_no_match:
                                      action:
                                        name: cluster
                                        typed_config:
                                          "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.matcher.v3.ClusterAction
                                          cluster: testupstream-dynamic-openai
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      allow_mode_override: true
                      # The router-level extproc owns the dynamic-fallback matcher inputs,
                      # including x-envoy-attempt-count; without this, ext_proc silently drops
                      # any x-envoy-* header mutation (injection and forged-value scrubbing).
                      mutation_rules:
                        allow_envoy: true
                      processing_mode:
                        request_header_mode: "SEND"
                        request_body_mode: "BUFFERED"
                        response_header_mode: "SEND"
                        response_body_mode: "BUFFERED"
                      grpc_service:
                        envoy_grpc:
                          cluster_name: extproc_cluster
                        timeout: 30s
                      message_timeout: 60s
                      metadataOptions:
                        receivingNamespaces:
                          untyped:
                            - io.envoy.ai_gateway
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppressEnvoyHeaders: true

  clusters:
    - name: extproc_cluster
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      per_connection_buffer_limit_bytes: 52428800
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              connection_keepalive:
                interval: 30s
                timeout: 5s
      load_assignment:
        cluster_name: extproc_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 1063
    - name: testupstream-openai
      connect_timeout: 0.25s
      type: STATIC
      per_connection_buffer_limit_bytes: 52428800
      lb_policy: ROUND_ROBIN
      outlier_detection:
        consecutive_5xx: 1
        interval: 1s
        base_ejection_time: 2s # Must be smaller than the require.Eventually's interval. Otherwise, the tests may pass without going through the fallback since the always-failing backend could be ejected by the time when require.Eventually retries due to the previous request IF the retry is not configured.
        max_ejection_percent: 100
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
          http_filters:
            - name: upstream_extproc
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                allow_mode_override: true
                request_attributes:
                  - xds.upstream_host_metadata.filter_metadata['aigateway.envoy.io']['per_route_rule_backend_name']
                processing_mode:
                  request_header_mode: "SEND"
