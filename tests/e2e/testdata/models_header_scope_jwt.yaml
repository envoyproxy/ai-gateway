---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: models-header-scope-jwt
  namespace: default
spec:
  parentRefs:
    - name: models-header-scope-jwt
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-jwt-sub
              value: client-a
            - type: Exact
              name: x-ai-eg-model
              value: model-a1
      backendRefs:
        - name: models-header-scope-jwt-backend
    - matches:
        - headers:
            - type: Exact
              name: x-jwt-sub
              value: client-a
            - type: Exact
              name: x-ai-eg-model
              value: model-a2
      backendRefs:
        - name: models-header-scope-jwt-backend
    - matches:
        - headers:
            - type: Exact
              name: x-jwt-sub
              value: client-b
            - type: Exact
              name: x-ai-eg-model
              value: model-b1
      backendRefs:
        - name: models-header-scope-jwt-backend
    - matches:
        - headers:
            - type: Exact
              name: x-jwt-sub
              value: client-b
            - type: Exact
              name: x-ai-eg-model
              value: model-b2
      backendRefs:
        - name: models-header-scope-jwt-backend
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: models-header-scope-jwt-policy
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: models-header-scope-jwt
  jwt:
    providers:
      - name: tenant-jwt
        issuer: https://auth-server.example.com
        recomputeRoute: true
        claimToHeaders:
          - claim: sub
            header: x-jwt-sub
        localJWKS:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: models-header-scope-jwt-jwks
  authorization:
    defaultAction: Deny
    rules:
      - name: allow-tenant-clients
        action: Allow
        principal:
          jwt:
            provider: tenant-jwt
            claims:
              - name: sub
                values:
                  - client-a
                  - client-b
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: models-header-scope-jwt-backend
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: models-header-scope-jwt-upstream
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: models-header-scope-jwt-backend-api-key
  namespace: default
spec:
  type: APIKey
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: models-header-scope-jwt-backend
  apiKey:
    secretRef:
      name: models-header-scope-jwt-backend-api-key
      namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: models-header-scope-jwt-backend-api-key
  namespace: default
type: Opaque
stringData:
  apiKey: dummy-token
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: models-header-scope-jwt-upstream
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: models-header-scope-jwt-upstream.default.svc.cluster.local
        port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: models-header-scope-jwt-upstream
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: models-header-scope-jwt-upstream
  template:
    metadata:
      labels:
        app: models-header-scope-jwt-upstream
    spec:
      containers:
        - name: models-header-scope-jwt-upstream
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: models-header-scope-jwt-upstream
  namespace: default
spec:
  selector:
    app: models-header-scope-jwt-upstream
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
