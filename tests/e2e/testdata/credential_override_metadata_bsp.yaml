# The same BackendSecurityPolicy as in credential_override_metadata.yaml, now with the
# credentialOverride. Applied mid-test to check that the policy change alone re-translates the
# running gateway.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: envoy-ai-gateway-credential-override
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: envoy-ai-gateway-credential-override-testupstream
  type: APIKey
  apiKey:
    secretRef:
      name: envoy-ai-gateway-credential-override-apikey
  credentialOverride:
    fromDynamicMetadata:
      namespace: envoy.filters.http.ext_authz
      key: x-aigw-api-key
