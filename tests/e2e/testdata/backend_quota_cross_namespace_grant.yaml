#
# ReferenceGrant authorizing QuotaPolicy in quota-policy-ns to target
# AIServiceBackend in quota-backend-ns.

apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-quotapolicy-to-aiservicebackend
  namespace: quota-backend-ns
spec:
  from:
    - group: aigateway.envoyproxy.io
      kind: QuotaPolicy
      namespace: quota-policy-ns
  to:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
