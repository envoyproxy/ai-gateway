apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: dynamic-fallback
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dynamic-fallback
  namespace: default
spec:
  gatewayClassName: dynamic-fallback
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: dynamic-fallback
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: dynamic-fallback
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # Clear the default memory/cpu requirements for local tests.
          resources: {}
          # refresh_cluster_on_retry requires Envoy >= 1.39.
          image: docker.io/envoyproxy/envoy:distroless-v1.39.0
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: dynamic-fallback
  namespace: default
  annotations:
    aigateway.envoyproxy.io/dynamic-fallback: "true"
spec:
  parentRefs:
    - name: dynamic-fallback
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: model-a
      backendRefs:
        # The aliases are the published fallback vocabulary; priorities are the default order.
        - name: backend-a
          alias: alpha
          priority: 0
        - name: backend-b
          alias: beta
          priority: 1
        - name: backend-c
          alias: gamma
          priority: 2
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dynamic-fallback
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # The HTTPRoute generated by the AIGatewayRoute has the same name as the AIGatewayRoute.
      name: dynamic-fallback
  retry:
    # Two attempts total: enough to walk one fallback hop, and few enough that the
    # scrubbed-forged-header test cannot reach the third backend through defaults.
    numRetries: 1
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
    retryOn:
      # 400 covers the testupstream's expected-testupstream-id mismatch, which the tests use
      # to make specific backends "fail"; 500 covers provider failures.
      httpStatusCodes:
        - 400
        - 500
      triggers:
        - connect-failure
        - retriable-status-codes
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: backend-a
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: backend-a
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: backend-b
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: backend-b
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: backend-c
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: backend-c
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-a
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: backend-a.default.svc.cluster.local
        port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-b
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: backend-b.default.svc.cluster.local
        port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: backend-c
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: backend-c.default.svc.cluster.local
        port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-a
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-a
  template:
    metadata:
      labels:
        app: backend-a
    spec:
      containers:
        - name: backend-a
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TESTUPSTREAM_ID
              value: backend-a
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: backend-a
  namespace: default
spec:
  selector:
    app: backend-a
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
